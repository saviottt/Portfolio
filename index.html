<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Don Savio Thomas</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* Moving Name Background */
        .marquee {
            position: absolute;
            top: 50%;
            left: 0;

            width: 100%;
            height: 330px;

            transform: translateY(-50%);

            overflow: hidden;

            z-index: 1;
        }

        .marquee-track {
            display: flex;
            width: max-content;

            animation: moveName 150s linear infinite;
        }

        .don-red {
            color: #e91e1e;
            -webkit-text-stroke: 0;
        }

        .moving-name {
            flex-shrink: 0;

            font-family: "Arial Black", Impact, Haettenschweiler,
                "Arial Narrow Bold", sans-serif;

            font-size: 320px;

            font-weight: 900;

            color: #000;

            -webkit-text-stroke: 5px #000;

            letter-spacing: -20px;

            line-height: 0.72;

            margin-right: 60px;

            padding: 0;
        }

        @keyframes moveName {
            from {
                transform: translateX(-20vw);
            }

            to {
                transform: translateX(calc(-50% - 20vw));
            }
        }

        /* =========================================================
           3D CELL FRAME & ANIMATIONS
           ========================================================= */

        /* Stage — bottom-aligned so image touches the page footer */
        .cell-stage {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: auto;
            cursor: grab;
            user-select: none;
        }

        .cell-stage:active {
            cursor: grabbing;
        }

        /* Portrait Image — plain, no frame */
        .portrait-img {
            position: relative;
            height: 100vh;
            width: auto;
            object-fit: cover;
            display: block;
            border-radius: 38px;
            z-index: 10;
        }

        /* =========================================================
           RESPONSIVE BREAKPOINTS
           ========================================================= */

        /* =========================================================
           ORBITING TECH LOGOS SYSTEM
           ========================================================= */

        /* Orbital trajectory track — hidden */
        .orbit-track {
            position: absolute;
            top: 50%;
            left: 50%;
            border: none;
            pointer-events: none;
        }

        /* Orbit Node Anchors */
        .orbit-node {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            pointer-events: auto;
            will-change: transform, opacity, z-index;
        }

        /* Floating Logos */
        .node-badge {
            position: absolute;
            top: -96px;
            left: -96px;
            width: 192px;
            height: 192px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .node-logo {
            width: 192px;
            height: 192px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
            transition: transform 0.25s ease, filter 0.25s ease;
            user-select: none;
            pointer-events: none;
        }

        .orbit-node:hover .node-badge {
            transform: scale(1.15) !important;
            z-index: 60;
        }

        .orbit-node:hover .node-logo {
            filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.4)) drop-shadow(0 0 24px var(--glow));
        }

        /* Tech Tooltip Label */
        .node-tooltip {
            position: absolute;
            bottom: -105px;
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            background: #000000;
            color: #ffffff;
            padding: 4px 11px;
            border-radius: 12px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.3);
            z-index: 70;
        }

        .orbit-node:hover .node-tooltip {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Medium screens */
        @media (max-width: 1200px) {

            .marquee {
                height: 270px;
            }

            .moving-name {
                font-size: 270px;
                letter-spacing: -17px;

                -webkit-text-stroke: 4px #000;

                margin-right: 45px;
            }

            .portrait-img {
                height: 100vh;
                width: auto;
                border-radius: 32px;
            }

            .orbit-track {
                width: 610px;
                height: 350px;
                margin-left: -305px;
                margin-top: -175px;
            }

            .node-badge {
                top: -72px;
                left: -72px;
                width: 144px;
                height: 144px;
            }

            .node-logo {
                width: 144px;
                height: 144px;
            }

            .node-tooltip {
                font-size: 10px;
                padding: 3px 9px;
                bottom: -80px;
            }
        }

        /* Mobile */
        @media (max-width: 600px) {

            .marquee {
                height: 170px;
            }

            .moving-name {
                font-size: 155px;
                letter-spacing: -9px;

                -webkit-text-stroke: 3px #000;

                margin-right: 25px;
            }

            .portrait-img {
                height: 100vh;
                width: auto;
                border-radius: 28px;
            }

            .orbit-track {
                width: 440px;
                height: 270px;
                margin-left: -220px;
                margin-top: -135px;
            }

            .node-badge {
                top: -56px;
                left: -56px;
                width: 112px;
                height: 112px;
            }

            .node-logo {
                width: 112px;
                height: 112px;
            }

            .node-tooltip {
                font-size: 9px;
                padding: 2px 7px;
                bottom: -64px;
            }
        }
    </style>
</head>

<body>

    <!-- Moving Name Background -->
    <div class="marquee">

        <div class="marquee-track">

            <div class="moving-name"><span class="don-red">DON </span>SAVIO THOMAS</div>
            <div class="moving-name"><span class="don-red">DON </span>SAVIO THOMAS</div>
            <div class="moving-name"><span class="don-red">DON </span>SAVIO THOMAS</div>
            <div class="moving-name"><span class="don-red">DON </span>SAVIO THOMAS</div>

            <div class="moving-name"><span class="don-red">DON </span>SAVIO THOMAS</div>
            <div class="moving-name"><span class="don-red">DON </span>SAVIO THOMAS</div>
            <div class="moving-name"><span class="don-red">DON </span>SAVIO THOMAS</div>
            <div class="moving-name"><span class="don-red">DON </span>SAVIO THOMAS</div>

        </div>

    </div>

    <!-- Portrait Image with Floating Logos -->
    <div class="cell-stage" id="cellStage">

        <!-- Faint orbital track -->
        <div class="orbit-track" id="orbitTrack"></div>

        <!-- Plain portrait image -->
        <img src="image.png" alt="Don Savio Thomas" class="portrait-img">

        <!-- 6 Orbiting Tech Nodes -->
        <div class="orbit-node" data-index="0" data-label="Flutter"
            style="--accent: #02569B; --glow: rgba(2, 86, 155, 0.45);">
            <div class="node-badge">
                <img src="logos/flutter.png" alt="Flutter" class="node-logo">
                <span class="node-tooltip">Flutter</span>
            </div>
        </div>

        <div class="orbit-node" data-index="1" data-label="Git"
            style="--accent: #F05032; --glow: rgba(240, 80, 50, 0.45);">
            <div class="node-badge">
                <img src="logos/git.png" alt="Git" class="node-logo">
                <span class="node-tooltip">Git</span>
            </div>
        </div>

        <div class="orbit-node" data-index="2" data-label="HTML5"
            style="--accent: #E34F26; --glow: rgba(227, 79, 38, 0.45);">
            <div class="node-badge">

                <span class="node-tooltip">HTML5</span>
            </div>
        </div>

        <div class="orbit-node" data-index="3" data-label="JavaScript"
            style="--accent: #E5A800; --glow: rgba(247, 223, 30, 0.5);">
            <div class="node-badge">
                <img src="logos/javascript.png" alt="JavaScript" class="node-logo">
                <span class="node-tooltip">JavaScript</span>
            </div>
        </div>

        <div class="orbit-node" data-index="4" data-label="MySQL"
            style="--accent: #00758F; --glow: rgba(0, 117, 143, 0.45);">
            <div class="node-badge">
                <img src="logos/mysql.png" alt="MySQL" class="node-logo">
                <span class="node-tooltip">MySQL</span>
            </div>
        </div>

        <div class="orbit-node" data-index="5" data-label="VS Code"
            style="--accent: #007ACC; --glow: rgba(0, 122, 204, 0.45);">
            <div class="node-badge">
                <img src="logos/vscode.png" alt="VS Code" class="node-logo">
                <span class="node-tooltip">VS Code</span>
            </div>
        </div>

    </div>
    </div>

    <!-- Floating Logo Animation Script -->
    <script>
        (function () {
            const orbitNodes = document.querySelectorAll('.orbit-node');

            // Inclination angle (-14 degrees)
            const TILT_RAD = -14 * (Math.PI / 180);
            const COS_TILT = Math.cos(TILT_RAD);
            const SIN_TILT = Math.sin(TILT_RAD);

            // Responsive orbital radii
            function getOrbitalRadii() {
                const w = window.innerWidth;
                if (w <= 600) {
                    return { rx: 320, ry: 240 };
                } else if (w <= 1200) {
                    return { rx: 400, ry: 300 };
                } else {
                    return { rx: 480, ry: 350 };
                }
            }

            let { rx, ry } = getOrbitalRadii();
            window.addEventListener('resize', () => {
                const radii = getOrbitalRadii();
                rx = radii.rx;
                ry = radii.ry;
            });

            // Animation render loop — pure floating only, no mouse tracking
            function animate() {
                const time = performance.now() * 0.0015;

                // Custom angles: 3 on the right side, 3 on the left side
                // Angles near 0 = right, angles near π = left
                // Vertical spread of ±0.55 rad (~31°) keeps logos clear of top/bottom
                const customAngles = [
                    0.55,               // right — upper
                    0.00,               // right — center
                    -0.55,               // right — lower
                    Math.PI - 0.55,     // left  — upper
                    Math.PI,            // left  — center
                    Math.PI + 0.55      // left  — lower
                ];

                orbitNodes.forEach((node, i) => {
                    const nodeAngle = customAngles[i] ?? (i * (Math.PI * 2 / 6));

                    // Position on 2D ellipse (fixed points)
                    const u = rx * Math.cos(nodeAngle);
                    const v = ry * Math.sin(nodeAngle);

                    // Rotate by inclination angle
                    const baseX = u * COS_TILT - v * SIN_TILT;
                    const baseY = u * SIN_TILT + v * COS_TILT;

                    // Independent floating per node (no mouse influence)
                    const floatY = Math.sin(time + i) * 12;

                    const x = baseX;
                    const y = baseY + floatY;

                    // Depth value for z-ordering (front/behind card)
                    const depth = Math.sin(nodeAngle);
                    const scale = 0.94 + 0.16 * Math.abs(depth);
                    const opacity = 1.0;
                    const zIndex = 20;

                    node.style.zIndex = zIndex;
                    node.style.opacity = opacity.toFixed(2);
                    node.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) scale(${scale.toFixed(2)})`;
                });

                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);
        })();
    </script>
</body>

</html>
